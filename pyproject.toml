# Metadata and lint config only. There are deliberately NO runtime dependencies:
# every stage and radar is standard library, so `./stages/discover.py` runs on a
# bare Python with no install step, no venv and no import gymnastics. That
# property is worth more than packaging elegance - keep it.
[project]
name = "credits-recommendation"
version = "0.1.0"
description = "Credits-based music discovery: who made the records you like, and what else they made."
requires-python = ">=3.11"        # uses `X | None` at runtime and Self-less generics
dependencies = []

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"contrib/*" = ["ALL"]             # vendored third-party gist, not ours to lint
