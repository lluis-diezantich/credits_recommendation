# This project ran on the standard library alone for most of its life, and the
# reason was good: every stage and radar worked on a bare Python, with no venv
# and no install step. What ended it was not elegance but two specific things
# the stdlib does badly -- connection pooling across ~90 sequential requests to
# one host, and retry/backoff that honours Retry-After -- plus roughly 70 lines
# of hand-rolled HTTP and test-runner code kept only to avoid these.
#
# The cost is real: `./radars/qobuz.py` now needs the venv on PATH.
#     python3 -m venv .venv && ./.venv/bin/pip install -e ".[dev]"
[project]
name = "music-recommendation"
version = "0.1.0"
description = "Credits-based music discovery: who made the records you like, and what else they made."
requires-python = ">=3.11"        # uses `X | None` at runtime and Self-less generics
dependencies = [
    "requests>=2.32",             # core/http.py: pooling, and urllib3's Retry
    "beautifulsoup4>=4.12",       # radars/remezcla.py: the only HTML here
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",            # coverage, so an untested file is visible
    "ruff>=0.6",
    "ty>=0.0.89",                 # types; everything here is annotated already
    "pre-commit>=3.7",            # ruff before the commit, not after it
]

# This is a collection of scripts, not a distributable package, but naming the
# real packages is what lets `pip install -e .` work at all: left to guess,
# setuptools finds data/, cache/ and notebooks/ too and refuses. The install
# exists to pull requests in, not to ship anything.
[tool.setuptools]
packages = ["core", "stages", "radars"]
# policy.py is a single module at the root, not a package, and naming it here is
# what lets `./stages/discover.py` import it. Running a file directly puts
# stages/ on sys.path, never the root -- which the scripts used to paper over
# with a sys.path.insert line each. The install replaces those ten lines, so it
# has to cover everything they reached, policy.py included.
py-modules = ["policy"]

[tool.pytest.ini_options]
# So `import core.qobuz` works without a sys.path line in every test file.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A showcase notebook is exploratory, and the conventions differ on purpose:
# `ax.set_yticks(y); ax.set_yticklabels(labels)` on one line is how plotting
# cells read. Linting it as a script would mean rewriting cells to satisfy
# rules that do not apply to them.
"notebooks/*" = ["ALL"]

# Coverage is measured to answer one question: which files does the suite not
# reach at all? policy.py sat at zero for the life of the project without that
# being obvious from "76 tests pass", which is the failure mode worth closing.
#
# No `fail_under`. A number here would be a target, and the useful signal is
# per-file: stages/load.py is 699 lines of bulk insert that a test suite with
# no fixtures for a 190k-row export cannot reach, and a global percentage
# averages that together with policy.py until neither means anything.
[tool.coverage.run]
source = ["core", "stages", "radars", "policy"]
omit = ["notebooks/*", "tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",   # every stage ends in one
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ty, not mypy: everything is annotated, nothing verified it, and `ruff` is
# lint. Narrow on purpose -- the point is to catch a signature that drifted
# from its caller, not to win an argument with requests' stubs.
[tool.ty.src]
exclude = [
    ".venv",
    "notebooks",                  # exploratory cells, same reason as ruff
    "cache",
    "data",
]

[tool.ty.rules]
# duckdb is an optional query-layer dependency, imported inside a try/except
# ImportError that exists precisely to report its absence (stages/load.py:105).
# An unresolved import there is the design, not a defect.
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
# A test that has just asserted an outcome is "exact" knows the hit is not
# None, and `assert hit is not None` on every line to prove it to the checker
# makes the suite worse at its actual job of being readable.
not-subscriptable = "ignore"
# requests' BaseAdapter stub does not expose max_retries/poolmanager, which is
# exactly what tests/test_http.py asserts the adapter was configured with.
unresolved-attribute = "ignore"
