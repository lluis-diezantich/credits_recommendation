# The suite, the types and the lint, on every push to main and every pull request.
#
# Advisory on purpose: no branch protection and no required checks, because a
# solo repo gains nothing from being unable to push a one-line fix. The point
# is the Friday radar -- a change that breaks it would otherwise show up as an
# empty issue or a red run a week later.
#
# No secrets and no network: the suite stubs every call at the seam, so it
# cannot reach Qobuz or ListenBrainz and cannot touch data/.
#
# Actions are pinned to commit SHAs, not to `@v4`. A major tag is a moving
# reference, so `@v4` means "whatever that tag points at the morning the radar
# runs" -- the one thing a job whose value is being trustworthy should not have.
# .github/dependabot.yml bumps them as pull requests.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      # `requires-python = ">=3.11"` was a claim: CI ran 3.12 alone, so the
      # floor was never exercised and neither was anything above it. 3.11 is
      # the floor, 3.12 is what the radar runs on, 3.13 is the warning that
      # something is about to break.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    name: py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install
        # The lock first, hashed, then the project itself with --no-deps: that
        # order is what makes the lock authoritative. `pip install -e ".[dev]"`
        # alone would re-resolve and quietly ignore it.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Types
        # Everything here is annotated and nothing verified it until now; ruff
        # is lint, not types. Scoped in pyproject.toml ([tool.ty]) rather than
        # by flags here, so `ty check` means the same thing on a laptop.
        run: ty check

      - name: Run the suite
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage summary
        # Into the job summary rather than a service: the question worth
        # answering is "which file does the suite not reach at all", and that
        # fits in a table. policy.py sat at zero for the life of the project
        # without "76 tests pass" ever hinting at it.
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Coverage (py${{ matrix.python-version }})"
            echo
            echo '```'
            coverage report || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the coverage xml
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 30
          if-no-files-found: ignore
