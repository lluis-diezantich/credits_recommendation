# The label radar (D44), on the shared runner.
#
# NO CRON, deliberately. This radar is a trial on its own branch: the decision
# is Proposed, the producer list behind it covers 20 of 167 artists, and the
# first thing to learn is what one run reports rather than what fifty of them
# do to an issue tracker. Run it by hand from the Actions tab, read the funnel
# in the warnings block, and add the schedule when the numbers in D44's
# Evidence have been re-measured here.
#
#   on:
#     schedule:
#       - cron: "47 5 * * 5"      # Fridays, after the known-artist radar
name: "releases: labels"

on:
  workflow_dispatch:
    inputs:
      days:
        description: "lookback window in days"
        default: "14"
      credit:
        description: "role families that count as news"
        default: "production"

permissions:
  contents: read
  issues: write

jobs:
  labels:
    uses: ./.github/workflows/radar.yml
    with:
      radar: radars/labels.py
      title: "releases: labels"
      days: ${{ inputs.days }}
      extra: "--credit ${{ inputs.credit }}"
      # STATELESS, which the shared runner no longer is by default: its default
      # commits the ids back to data/ci/ (D11), and a hand-run trial must not
      # write state into a branch. Every run therefore reports its whole
      # window, which is what you want while reading the funnel -- and this
      # radar records only what it printed anyway (record_scanned = False), so
      # the file would not have protected an uncredited release from being
      # re-read.
      stateless: true
