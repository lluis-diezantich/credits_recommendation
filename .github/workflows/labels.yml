# The label radar (D44). No schedule yet: workflow_dispatch is only offered for
# workflows on the default branch, so this cannot be triggered until it is on
# main. Two open calls after that -- ~12 rows a week against the known-artist
# radar's 5.8, and the executive-producer and mastering-engineer patterns D44
# records. Uncomment to schedule:
#
#   on:
#     schedule:
#       - cron: "47 5 * * 5"      # Fridays, after the known-artist radar

name: "releases: labels"

on:
  workflow_dispatch:
    inputs:
      days:
        description: "lookback window in days"
        default: "14"
      credit:
        description: "role families that count as news"
        default: "production"

permissions:
  contents: read
  issues: write

jobs:
  labels:
    uses: ./.github/workflows/radar.yml
    with:
      radar: radars/labels.py
      title: "releases: labels"
      days: ${{ inputs.days }}
      extra: "--credit ${{ inputs.credit }}"
      # The runner's default commits ids back to data/ci/ (D11), and a
      # hand-run trial must not write state into a branch.
      stateless: true
