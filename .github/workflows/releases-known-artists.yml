# New releases from artists you already know, weekly, as an issue.
#
# Scoped in the name on purpose: this one only ever reports artists already in
# data/favourites.json. Releases from artists you do NOT know is a different
# job with a different precision/recall trade -- the credits pools, the
# Remezcla picks, the fresh-releases feed -- and belongs in its own caller
# writing its own issues, so one can be noisy without making the other
# untrustworthy.
#
# The steps live in .github/workflows/radar.yml. This file is only the two
# decisions that are actually about THIS radar: when to look, and with what.
#
# It takes radar.yml's state defaults, so this radar is now STATEFUL: the run
# reads data/ci/qobuz_seen.json, reports only what is not in it, and commits it
# back. Before that it passed --all and leaned on the date window, which
# re-reported a release in two consecutive issues whenever days exceeded seven.
# Pass stateless: true for a backfill, where recording the back catalogue as
# seen would silence the next real run.
#
# Needs no secrets: the watchlist (data/favourites.json) is committed and the
# Qobuz app id is a public web-player value, not a key.
name: "releases: known artists"

on:
  schedule:
    # Fridays, 05:17 CET -- written as 04:17 UTC, because GitHub cron has no
    # timezone and Europe/Madrid is UTC+1 in winter, UTC+2 in summer. So this
    # is 05:17 under CET and 06:17 under CEST; an hour of drift twice a year,
    # which for a weekly radar is nothing. Pinning true local time would need a
    # guard step that re-checks the hour and exits.
    #
    # :17 rather than :00 on purpose. Scheduled jobs queue, and every cron a
    # human writes lands on the hour, so an off-minute usually starts sooner.
    - cron: "17 4 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "how many days back to report"
        default: "7"
      store:
        description: "Qobuz storefront"
        default: "gb-en"

# contents: write, because radar.yml commits the state file back and a called
# workflow can never hold MORE permission than its caller grants -- leaving this
# at `read` makes the push 403 while every other step succeeds, which is the
# quietest possible way to lose the state.
permissions:
  contents: write
  issues: write

jobs:
  qobuz:
    uses: ./.github/workflows/radar.yml
    with:
      radar: radars/qobuz.py
      title: "releases: known artists"
      days: ${{ inputs.days || '7' }}
      extra: --store ${{ inputs.store || 'gb-en' }}
