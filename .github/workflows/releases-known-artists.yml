# New releases from artists you already know, weekly, as an issue.
#
# Scoped in the name on purpose: this one only ever reports artists already in
# data/favourites.json. Releases from artists you do NOT know is a different
# job with a different precision/recall trade -- the credits pools, the
# Remezcla picks, the fresh-releases feed -- and belongs in its own caller
# writing its own issues, so one can be noisy without making the other
# untrustworthy.
#
# The steps live in .github/workflows/radar.yml. This file is only the two
# decisions that are actually about THIS radar: when to look, and with what.
#
# It passes stateless: true, so this radar reports the WHOLE window every week
# and records nothing -- data/ci/qobuz_seen.json is frozen at the 7278 ids the
# two 2026-10-23 runs left in it. A deliberate step back from D11, taken
# because a full week in one issue is worth more right now than a
# duplicate-free one. Two costs, both accepted: the git history of that file
# stops being the impression log docs/roadmap.md wants, and the first stateful
# run after this re-reports everything since the freeze. D32 has the argument.
#
# Needs no secrets: the watchlist (data/favourites.json) is committed and the
# Qobuz app id is a public web-player value, not a key.
name: "releases: known artists"

on:
  schedule:
    # Late Friday, 20:17 UTC -- 21:17 under CET, 22:17 under CEST, because
    # GitHub cron has no timezone and Europe/Madrid is UTC+1 in winter and
    # UTC+2 in summer. An hour of drift twice a year, which for a weekly radar
    # is nothing; pinning true local time would need a guard step that
    # re-checks the hour and exits.
    #
    # End of the day, not the start, because Friday IS release day. The old
    # 04:17 slot ran before the catalogue had filled: on 2026-10-23 a 06:12 run
    # saw 7272 ids and the 09:20 run saw 6 more, three of them dated that same
    # Friday.
    #
    # Not later than 20:17, deliberately. The runner's clock is UTC, and both
    # the issue title (`date -u +%F`) and the date window (dt.date.today() in
    # core/radar.py) flip at midnight UTC. GitHub's scheduler is best-effort
    # and ran 5h03m late on 2026-10-23, so a 22:17 slot would have landed on
    # Saturday's date with a Saturday window. This leaves that slack.
    #
    # :17 rather than :00 on purpose. Scheduled jobs queue, and every cron a
    # human writes lands on the hour, so an off-minute usually starts sooner.
    - cron: "17 20 * * 5"
  workflow_dispatch:
    inputs:
      days:
        description: "how many days back to report"
        default: "6"
      store:
        description: "Qobuz storefront"
        default: "gb-en"

# contents: write buys nothing while stateless: true, because nothing is
# pushed. Kept anyway, so turning state back on stays a one-line change: a
# called workflow can never hold MORE permission than its caller grants, and
# leaving this at `read` makes only the state push 403 while every other step
# succeeds -- the quietest possible way to lose the state.
permissions:
  contents: write
  issues: write

jobs:
  qobuz:
    uses: ./.github/workflows/radar.yml
    with:
      radar: radars/qobuz.py
      title: "releases: known artists"
      days: ${{ inputs.days || '6' }}
      # The whole window every week, repeats included. The cutoff is inclusive
      # (core/radar.py's `release.date < cutoff`), so `7` spans eight days and
      # last Friday reappears in every issue. Expected, not a bug.
      stateless: true
      extra: --store ${{ inputs.store || 'gb-en' }}
